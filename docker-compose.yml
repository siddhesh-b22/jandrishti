# ====================================================================
# JanDrishti — Production Container Orchestration (Docker Compose)
# Civic Data Intelligence Platform
# ====================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jandrishti-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=database/mplads.db
      - AUDIT_DATABASE_PATH=database/audit_cases.db
      - CORS_ORIGINS=*
      - RATE_LIMIT_GENERAL_PER_MINUTE=300
      - RATE_LIMIT_MUTATIONS_PER_MINUTE=60
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - jandrishti-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: jandrishti-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jandrishti-net

networks:
  jandrishti-net:
    driver: bridge
