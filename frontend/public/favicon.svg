<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#08102B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#60A5FA" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Card -->
  <rect width="32" height="32" rx="8" fill="url(#bg-grad)" />
  
  <!-- Top Light Ambient Flare -->
  <circle cx="26" cy="6" r="3.5" fill="#FFFFFF" fill-opacity="0.2" />

  <!-- People's Rights & Constitutional Protection Shield -->
  <path
    d="M16 5.5L6.5 9.2V16C6.5 22.2 10.8 27.5 16 29C21.2 27.5 25.5 22.2 25.5 16V9.2L16 5.5Z"
    stroke="#FFFFFF"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#FFFFFF"
    fill-opacity="0.08"
  />

  <!-- Citizen / People Silhouette (Head & Torso) -->
  <circle cx="16" cy="14" r="2.8" fill="#FFFFFF" />
  <path
    d="M11.5 22.5C11.5 20.2 13.5 18.5 16 18.5C18.5 18.5 20.5 20.2 20.5 22.5"
    stroke="#FFFFFF"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Drishti Transparency Point (Cyan Beacon) -->
  <circle cx="16" cy="8.2" r="1.3" fill="#60A5FA" filter="url(#glow)" />
</svg>
