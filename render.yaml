# ====================================================================
# JanDrishti — Render Infrastructure-as-Code Blueprint
# Civic Data Intelligence Platform
# ====================================================================

services:

  # ================================================================
  # BACKEND — FastAPI + Immutable Read-Only SQLite
  # ================================================================
  - type: web
    name: jandrishti-api
    runtime: python
    plan: free
    region: oregon

    buildCommand: "pip install --no-cache-dir -r requirements.txt"

    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2"

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

      - key: DATABASE_PATH
        value: database/mplads.db

      - key: CORS_ORIGINS
        value: "*"


  # ================================================================
  # FRONTEND — React + Vite Static SPA
  # ================================================================
  - type: web
    name: jandrishti-web
    runtime: static

    rootDir: frontend

    buildCommand: "npm install && npm run build"

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://jandrishti-api.onrender.com