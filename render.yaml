# ====================================================================
# JanDrishti — Render Infrastructure-as-Code Blueprint
# Production deployment: FastAPI + React/Vite + Read-Only SQLite
# ====================================================================

services:

  # ================================================================
  # 1. BACKEND — FastAPI Web Service
  # ================================================================
  - type: web
    name: jandrishti-api
    runtime: python
    plan: free
    region: oregon

    buildCommand: "pip install --no-cache-dir -r requirements.txt"

    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2"

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

      - key: DATABASE_PATH
        value: database/mplads.db

      - key: CORS_ORIGINS
        value: "*"


  # ================================================================
  # 2. FRONTEND — React/Vite Static Site
  # ================================================================
  - type: web
    name: jandrishti-web
    runtime: static

    rootDir: frontend

    buildCommand: "npm install && npm run build"

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jandrishti-api
          property: host