# ====================================================================
# JanDrishti — Render Infrastructure-as-Code Blueprint
# Free-tier deployment packaging Python FastAPI + Immutable SQLite DB
# ====================================================================

services:
  # 1. Backend Web Service (FastAPI + Read-Only SQLite)
  - type: web
    name: jandrishti-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_PATH
        value: database/mplads.db
      - key: CORS_ORIGINS
        value: "*"

  # 2. Frontend Static Site (React + Vite SPA)
    - type: web
    name: jandrishti-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jandrishti-api
          property: host
